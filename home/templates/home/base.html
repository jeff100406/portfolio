{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Jeff Gabriel Yowan | Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'home/tooplate-2167-orbital-style.css' %}">

    <link rel="stylesheet"
          href="{% static 'home/portfolio-pages.css' %}">

</head>

<body class="portfolio-page">

    <div class="aura"></div>
    <div class="stars"></div>

    <nav class="page-nav">

        <a href="{% url 'home' %}" class="page-logo">
            G.JEFF GABRIEL YOWAN <span>// AI&ML</span>
        </a>

        <a href="{% url 'home' %}" class="back-home">
            ← BACK TO ORBITAL
        </a>

    </nav>


    <main class="page-container">

        {% block content %}

        {% endblock %}

    </main>


</body>
</html>
